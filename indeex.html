
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Locator</title>

    <link rel="stylesheet" href="style.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

    <header>
        <h1>🌍 City Locator</h1>
        <p>Find and explore places around the world</p>
    </header>

    <main class="container">

        <div class="search-box">
            <input type="text" id="cityInput"
            placeholder="Enter city or municipality...">

            <button onclick="searchCity()">Search</button>
        </div>

        <div id="message"></div>

        <div class="info">
            <h2>Location Information</h2>
            <p><strong>City:</strong> <span id="cityName">None</span></p>
            <p><strong>Country:</strong> <span id="country">None</span></p>
            <p><strong>Latitude:</strong> <span id="latitude">None</span></p>
            <p><strong>Longitude:</strong> <span id="longitude">None</span></p>
        </div>

        <div id="map"></div>

    </main>

    <footer>
        <p>City Locator Project | Powered by Leaflet & OpenStreetMap</p>
    </footer>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="script.js"></script>

</body>
</html>
